packages:
  - backend
  - frontend
  - 'packages/*'

# pnpm 10+ blocks lifecycle scripts by default.
# Add packages that require native builds (adjust based on what you use):
allowBuilds:
  '@swc/core': true
  esbuild: true
  bcrypt: true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
